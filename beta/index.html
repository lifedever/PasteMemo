<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PasteMemo Beta — Preview Channel</title>
  <link rel="icon" type="image/svg+xml" href="../logo-2.svg">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --orange-400: #FB923C;
      --orange-500: #F97316;
      --orange-600: #EA580C;
      --bg: #FAFAF7;
      --bg-alt: #FFFFFF;
      --card-bg: #FFFFFF;
      --card-border: #E7E5E0;
      --divider: #EFEDE8;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --text: #2A2A2A;
      --text-heading: #0F172A;
      --text-secondary: #4B5563;
      --text-muted: #707782;
      --code-bg: #F4F2EE;
      --warn-bg: #FEF8EB;
      --warn-text: #92400E;
      --warn-border: #F59E0B;
      --shadow-card: 0 1px 2px rgba(28,25,23,0.04), 0 4px 24px rgba(28,25,23,0.05);
      --shadow-card-hover: 0 1px 2px rgba(28,25,23,0.06), 0 8px 32px rgba(28,25,23,0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E0E0E;
        --bg-alt: #141414;
        --card-bg: #1A1A1A;
        --card-border: #2A2925;
        --divider: #2A2925;
        --border: #262626;
        --border-strong: #3A3A3A;
        --text: #E5E7EB;
        --text-heading: #FAFAFA;
        --text-secondary: #B8B8B8;
        --text-muted: #888;
        --code-bg: #232120;
        --warn-bg: rgba(245, 158, 11, 0.08);
        --warn-text: #FCD34D;
        --warn-border: rgba(245, 158, 11, 0.5);
        --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 4px 24px rgba(0,0,0,0.25);
        --shadow-card-hover: 0 1px 2px rgba(0,0,0,0.4), 0 8px 32px rgba(0,0,0,0.35);
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top navigation */
    .topnav {
      border-bottom: 1px solid var(--card-border);
      background: var(--bg);
    }
    .topnav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-heading);
      text-decoration: none;
    }
    .nav-brand img {
      width: 30px;
      height: 30px;
      border-radius: 7px;
    }
    .nav-brand-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
    }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--text-heading); }
    .nav-links a.active {
      color: var(--text-heading);
      font-weight: 600;
    }

    /* Hero */
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 36px 32px 96px;
    }
    .hero {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }
    .hero-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      flex: 0 0 auto;
      box-shadow: 0 4px 16px rgba(249, 115, 22, 0.18);
    }
    .hero-text { min-width: 0; }
    .hero-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-heading);
      margin: 0 0 6px;
      line-height: 1.1;
      flex-wrap: wrap;
    }
    .beta-tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 9px;
      background: var(--orange-500);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      border-radius: 4px;
      text-transform: uppercase;
      vertical-align: middle;
    }
    .hero-subtitle {
      color: var(--text-secondary);
      font-size: 15.5px;
      margin: 0;
      max-width: 560px;
    }

    /* Warn banner — subtle tinted card with left accent */
    .warn {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid color-mix(in srgb, var(--warn-border) 35%, transparent);
      border-left: 3px solid var(--warn-border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13.5px;
      margin: 28px 0 36px;
    }
    .warn-icon {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      margin-top: 2px;
    }
    .warn p { margin: 0; line-height: 1.6; }

    /* Release card */
    .release-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .release-card-meta {
      padding: 22px 28px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .release-version {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.015em;
      font-variant-numeric: tabular-nums;
    }
    .release-channel {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 9px;
      background: rgba(249, 115, 22, 0.1);
      color: var(--orange-600);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    @media (prefers-color-scheme: dark) {
      .release-channel { color: var(--orange-400); background: rgba(249, 115, 22, 0.15); }
    }
    .release-channel::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .release-section {
      padding: 8px 28px 28px;
    }
    .release-section + .release-section { border-top: 1px solid var(--divider); padding-top: 24px; }
    .section-title {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Notes content */
    .notes {
      color: var(--text);
      font-size: 14.5px;
    }
    .notes h2, .notes h3 {
      color: var(--text-heading);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .notes h2 { font-size: 16px; margin: 24px 0 10px; }
    .notes h3 { font-size: 14.5px; margin: 20px 0 8px; }
    .notes h2:first-child, .notes h3:first-child { margin-top: 0; }
    .notes p { margin: 10px 0; }
    .notes ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .notes li {
      position: relative;
      margin: 12px 0;
      padding-left: 18px;
      line-height: 1.72;
    }
    .notes li:first-child { margin-top: 4px; }
    .notes li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 11px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      opacity: 0.45;
    }
    .notes strong {
      color: var(--text-heading);
      font-weight: 600;
    }

    /* Category tag pills */
    .notes strong.tag-new,
    .notes strong.tag-improve,
    .notes strong.tag-fix {
      display: inline-block;
      min-width: 38px;
      text-align: center;
      padding: 2px 8px;
      margin-right: 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.45;
      color: #FFFFFF;
      vertical-align: 1px;
    }
    .notes strong.tag-new     { background: #059669; }
    .notes strong.tag-improve { background: #2563EB; }
    .notes strong.tag-fix     { background: #D97706; }
    @media (prefers-color-scheme: dark) {
      .notes strong.tag-new     { background: #10B981; }
      .notes strong.tag-improve { background: #3B82F6; }
      .notes strong.tag-fix     { background: #F59E0B; }
    }

    .notes a {
      color: var(--orange-600);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--orange-500) 35%, transparent);
      transition: border-color 0.15s;
    }
    .notes a:hover { border-bottom-color: var(--orange-500); }
    @media (prefers-color-scheme: dark) {
      .notes a { color: var(--orange-400); }
    }
    .notes hr {
      border: none;
      border-top: 1px solid var(--divider);
      margin: 20px 0;
    }
    .notes code {
      background: var(--code-bg);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }

    /* Downloads */
    .downloads {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    /* First-open (Gatekeeper) help — revealed after a download click */
    .first-open-help {
      display: none;
      margin-top: 14px;
      background: rgba(249, 115, 22, 0.08);
      border: 1px solid rgba(249, 115, 22, 0.35);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
    }
    .first-open-help.show { display: block; }
    .first-open-help h4 {
      margin: 0 0 6px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-heading);
    }
    .first-open-cmd {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      padding: 8px 10px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--text-heading);
    }
    .first-open-cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
    .first-open-copy {
      flex-shrink: 0;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .first-open-copy:hover { color: var(--orange-500); background: rgba(249, 115, 22, 0.1); }
    .dl-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--bg-alt);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .dl-btn:hover {
      border-color: var(--orange-500);
      box-shadow: 0 2px 10px rgba(249, 115, 22, 0.12);
      transform: translateY(-1px);
    }
    .dl-btn:active { transform: translateY(0); box-shadow: none; }
    .dl-btn-icon {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: rgba(249, 115, 22, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--orange-600);
      transition: background 0.15s, color 0.15s;
    }
    @media (prefers-color-scheme: dark) {
      .dl-btn-icon { background: rgba(249, 115, 22, 0.12); color: var(--orange-400); }
    }
    .dl-btn:hover .dl-btn-icon {
      background: var(--orange-500);
      color: #FFFFFF;
    }
    .dl-btn-icon svg { width: 18px; height: 18px; display: block; }
    .dl-btn-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .dl-btn-title {
      color: var(--text-heading);
      font-size: 14.5px;
      font-weight: 600;
    }
    .dl-btn-meta {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dl-btn-size {
      flex: 0 0 auto;
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* States */
    .state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-secondary);
    }
    .state p { margin: 0; font-size: 14.5px; }
    .state .cta { margin-top: 20px; }
    .state .cta a {
      color: var(--orange-600);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid color-mix(in srgb, var(--orange-500) 35%, transparent);
      padding-bottom: 1px;
    }
    .state .cta a:hover { border-bottom-color: var(--orange-500); }

    /* Footer */
    footer {
      border-top: 1px solid var(--card-border);
      background: var(--bg);
      margin-top: 40px;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 40px 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .footer-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13.5px;
    }
    .footer-brand img {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      opacity: 0.85;
    }
    .footer-brand:hover { color: var(--text-heading); }
    .footer-links {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--text-heading); }
    .footer-meta {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 12px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 40px 28px;
    }

    @media (max-width: 680px) {
      .topnav-inner { padding: 14px 20px; gap: 12px; }
      .nav-brand-name { font-size: 16px; }
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 13px; }
      main { padding: 28px 20px 56px; }
      .footer-inner { padding: 28px 20px 24px; flex-direction: column; align-items: flex-start; gap: 16px; }
      .footer-meta { padding: 0 20px 28px; }
      .hero { flex-direction: row; gap: 14px; align-items: center; }
      .hero-icon { width: 52px; height: 52px; border-radius: 12px; }
      .hero-title { font-size: 26px; }
      .release-card-meta { padding: 18px 20px 14px; }
      .release-section { padding: 8px 20px 22px; }
      .release-section + .release-section { padding-top: 20px; }
      .downloads { grid-template-columns: 1fr; }
    }
  </style>
</head>

        "warn": "Beta 是預發行版本，建議在非關鍵機器上測試。在 設定 → 關於 中開啟 Beta 通道後，應用會自動接收下一個 Beta 版本。",
        "section_notes": "更新內容",
        "section_downloads": "下載",
        "channel_beta": "Beta 通道",
        "empty": "目前沒有可用的 Beta 版本。",
        "empty_cta": "查看正式版 →",
        "loading": "載入中…",
        "error": "無法載入 Beta 資訊，請稍後再試。",
        "arch_arm": "Apple Silicon",
        "arch_arm_detail": "M1 / M2 / M3 / M4 / M5",
        "arch_intel": "Intel",
        "arch_intel_detail": "x86_64",
        "firstopen_title": "首次打不開？",
        "firstopen_desc": "PasteMemo 暫未經 Apple 公證，macOS 可能會攔截。macOS 15/26 的「右鍵 → 打開」已失效，任選一種放行：",
        "firstopen_copy": "複製",
        "firstopen_or": "或：系統設定 → 隱私權與安全性 → 下滑找到 PasteMemo → 仍要打開。"
      }
    };

    function pickLang() {
      const nav = (navigator.language || 'en').toLowerCase();
      if (nav.startsWith('zh')) {
        return (nav.includes('hant') || nav.includes('tw') || nav.includes('hk')) ? 'zh-Hant' : 'zh-Hans';
      }
      return 'en';
    }
    const lang = pickLang();
    const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
    const setText = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.textContent = t(key);
    };
    document.documentElement.lang = lang;
    setText('navStable', 'nav_stable');
    setText('navBeta', 'nav_beta');
    setText('navChangelog', 'nav_changelog');
    setText('navSponsor', 'nav_sponsor');
    setText('navGithub', 'nav_github');
    setText('footerStable', 'footer_stable');
    setText('footerChangelog', 'footer_changelog');
    setText('footerHelp', 'footer_help');
    setText('footerFeedback', 'footer_feedback');
    setText('footerGithub', 'footer_github');
    setText('footerBrand', 'title');
    setText('footerMeta', 'footer_meta');
    setText('title', 'title');
    setText('subtitle', 'subtitle');
    setText('warn', 'warn');
    document.title = `${t('title')} Beta — Preview Channel`;

    // ============================================================
    // Helpers
    // ============================================================
    function fmtSize(bytes) {
      if (!bytes) return '';
      const mb = bytes / 1048576;
      return mb >= 100 ? mb.toFixed(0) + ' MB' : mb.toFixed(1) + ' MB';
    }

    function safeUrl(url) {
      if (!url) return '#';
      const trimmed = String(url).trim();
      return /^(https?:|mailto:|\/|\.\.?\/|#)/i.test(trimmed) ? trimmed : '#';
    }

    // ============================================================
    // Markdown renderer (DOM-based, no innerHTML)
    // ============================================================
    function tokenizeInline(text) {
      const out = [];
      const re = /\*\*([^*]+?)\*\*|\[([^\]]+)\]\(([^)]+)\)/g;
      const matches = [...text.matchAll(re)];
      let i = 0;
      for (const m of matches) {
        if (m.index > i) out.push({ kind: 'text', value: text.slice(i, m.index) });
        if (m[1] !== undefined) {
          out.push({ kind: 'bold', value: m[1] });
        } else {
          out.push({ kind: 'link', text: m[2], url: m[3] });
        }
        i = m.index + m[0].length;
      }
      if (i < text.length) out.push({ kind: 'text', value: text.slice(i) });
      return out;
    }

    function releaseTagClass(text) {
      const t = (text || '').trim().toLowerCase();
      if (t === '新增' || t === 'new') return 'tag-new';
      if (t === '改进' || t === '优化' || t === 'improve' || t === 'improved') return 'tag-improve';
      if (t === '修复' || t === 'fix' || t === 'fixed') return 'tag-fix';
      return null;
    }

    function renderInline(text, host) {
      for (const tok of tokenizeInline(text)) {
        if (tok.kind === 'text') {
          host.appendChild(document.createTextNode(tok.value));
        } else if (tok.kind === 'bold') {
          const s = document.createElement('strong');
          s.textContent = tok.value;
          const cls = releaseTagClass(tok.value);
          if (cls) s.className = cls;
          host.appendChild(s);
        } else if (tok.kind === 'link') {
          const a = document.createElement('a');
          a.href = safeUrl(tok.url);
          a.textContent = tok.text;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          host.appendChild(a);
        }
      }
    }

    function renderMarkdown(text, host) {
      const lines = text.split('\n');
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();
        if (!trimmed) { i++; continue; }

        if (trimmed.startsWith('### ')) {
          const h = document.createElement('h3');
          renderInline(trimmed.slice(4).trim(), h);
          host.appendChild(h);
          i++;
        } else if (trimmed.startsWith('## ')) {
          const h = document.createElement('h2');
          renderInline(trimmed.slice(3).trim(), h);
          host.appendChild(h);
          i++;
        } else if (/^---+$/.test(trimmed)) {
          host.appendChild(document.createElement('hr'));
          i++;
        } else if (line.startsWith('- ')) {
          const ul = document.createElement('ul');
          while (i < lines.length && lines[i].startsWith('- ')) {
            const li = document.createElement('li');
            renderInline(lines[i].slice(2), li);
            ul.appendChild(li);
            i++;
          }
          host.appendChild(ul);
        } else {
          const p = document.createElement('p');
          let buf = line;
          i++;
          while (i < lines.length) {
            const next = lines[i];
            const nt = next.trim();
            if (!nt) break;
            if (next.startsWith('- ') || nt.startsWith('## ') || nt.startsWith('### ') || /^---+$/.test(nt)) break;
            buf += '\n' + next;
            i++;
          }
          renderInline(buf, p);
          host.appendChild(p);
        }
      }
    }

    // ============================================================
    // Strip the trailing "⚠️ 这是 Beta 测试版本..." warning paragraph and
    // any leftover horizontal rule from the notes body — the same warning
    // already lives in the page-level banner up top, so showing it twice
    // is redundant noise.
    // ============================================================
    function stripBetaWarning(text) {
      if (!text) return text;
      const lines = text.split('\n');
      let cut = lines.length;
      for (let i = 0; i < lines.length; i++) {
        if (/^⚠️/.test(lines[i].trim())) { cut = i; break; }
      }
      while (cut > 0 && !lines[cut - 1].trim()) cut--;
      while (cut > 0 && /^---+$/.test(lines[cut - 1].trim())) cut--;
      while (cut > 0 && !lines[cut - 1].trim()) cut--;
      return lines.slice(0, cut).join('\n');
    }

    // ============================================================
    // State renderers
    // ============================================================
    const DOWNLOAD_ICON_PATH = 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3';

    function renderState(messageKey, ctaKey, ctaHref) {
      const host = document.getElementById('content');
      host.replaceChildren();
      const wrap = document.createElement('div');
      wrap.className = 'state';
      const p = document.createElement('p');
      p.textContent = t(messageKey);
      wrap.appendChild(p);
      if (ctaKey) {
        const ctaWrap = document.createElement('div');
        ctaWrap.className = 'cta';
        const a = document.createElement('a');
        a.href = ctaHref;
        a.textContent = t(ctaKey);
        ctaWrap.appendChild(a);
        wrap.appendChild(ctaWrap);
      }
      host.appendChild(wrap);
    }

    function makeDownloadIcon() {
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', DOWNLOAD_ICON_PATH);
      svg.appendChild(path);
      return svg;
    }

    function archButton(label, detail, url, size) {
      const a = document.createElement('a');
      a.className = 'dl-btn';
      a.href = safeUrl(url);

      const iconWrap = document.createElement('span');
      iconWrap.className = 'dl-btn-icon';
      iconWrap.appendChild(makeDownloadIcon());
      a.appendChild(iconWrap);

      const body = document.createElement('span');
      body.className = 'dl-btn-body';
      const title = document.createElement('span');
      title.className = 'dl-btn-title';
      title.textContent = label;
      body.appendChild(title);
      const meta = document.createElement('span');
      meta.className = 'dl-btn-meta';
      meta.textContent = detail;
      body.appendChild(meta);
      a.appendChild(body);

      if (size) {
        const sizeEl = document.createElement('span');
        sizeEl.className = 'dl-btn-size';
        sizeEl.textContent = fmtSize(size);
        a.appendChild(sizeEl);
      }

      // Surface the Gatekeeper "first open" steps the moment a download starts.
      a.addEventListener('click', revealFirstOpenHelp);
      return a;
    }

    function makeFirstOpenHelp() {
      const box = document.createElement('div');
      box.className = 'first-open-help';
      box.id = 'firstOpenHelp';

      const h = document.createElement('h4');
      h.textContent = '⚠️ ' + t('firstopen_title');
      box.appendChild(h);

      const desc = document.createElement('div');
      desc.textContent = t('firstopen_desc');
      box.appendChild(desc);

      const cmd = document.createElement('div');
      cmd.className = 'first-open-cmd';
      const code = document.createElement('code');
      code.id = 'firstOpenCmd';
      code.textContent = 'xattr -cr /Applications/PasteMemo.app';
      cmd.appendChild(code);
      const copyBtn = document.createElement('button');
      copyBtn.className = 'first-open-copy';
      copyBtn.textContent = t('firstopen_copy');
      copyBtn.addEventListener('click', () => copyFirstOpenCmd(copyBtn));
      cmd.appendChild(copyBtn);
      box.appendChild(cmd);

      const or = document.createElement('div');
      or.textContent = t('firstopen_or');
      box.appendChild(or);

      return box;
    }

    function revealFirstOpenHelp() {
      const el = document.getElementById('firstOpenHelp');
      if (el) el.classList.add('show');
    }

    function copyFirstOpenCmd(btn) {
      const code = document.getElementById('firstOpenCmd');
      if (!code || !navigator.clipboard) return;
      navigator.clipboard.writeText(code.textContent).then(() => {
        const orig = btn.textContent;
        btn.textContent = lang === 'zh-Hant' ? '已複製' : lang.startsWith('zh') ? '已复制' : 'Copied';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    }

    function renderBeta(beta) {
      const host = document.getElementById('content');
      host.replaceChildren();

      const card = document.createElement('article');
      card.className = 'release-card';

      // Header strip
      const meta = document.createElement('div');
      meta.className = 'release-card-meta';
      const ver = document.createElement('span');
      ver.className = 'release-version';
      ver.textContent = 'v' + String(beta.version || '');
      meta.appendChild(ver);
      const channel = document.createElement('span');
      channel.className = 'release-channel';
      channel.textContent = t('channel_beta');
      meta.appendChild(channel);
      card.appendChild(meta);

      // What's New section
      const notesSection = document.createElement('section');
      notesSection.className = 'release-section';
      const notesLabel = document.createElement('span');
      notesLabel.className = 'section-title';
      notesLabel.textContent = t('section_notes');
      notesSection.appendChild(notesLabel);
      const notes = document.createElement('div');
      notes.className = 'notes';
      const rawNotes = (lang.startsWith('zh') ? beta.notes_zh : beta.notes_en) || beta.notes_en || beta.notes_zh || '';
      renderMarkdown(stripBetaWarning(rawNotes), notes);
      notesSection.appendChild(notes);
      card.appendChild(notesSection);

      // Downloads section
      const dlSection = document.createElement('section');
      dlSection.className = 'release-section';
      const dlLabel = document.createElement('span');
      dlLabel.className = 'section-title';
      dlLabel.textContent = t('section_downloads');
      dlSection.appendChild(dlLabel);
      const downloads = document.createElement('div');
      downloads.className = 'downloads';
      const arm = (beta.checksums && beta.checksums.arm64) || (beta.downloads && beta.downloads.arm64);
      const x86 = (beta.checksums && beta.checksums.x86_64) || (beta.downloads && beta.downloads.x86_64);
      const armUrl = typeof arm === 'string' ? arm : arm && arm.url;
      const x86Url = typeof x86 === 'string' ? x86 : x86 && x86.url;
      if (armUrl) downloads.appendChild(archButton(t('arch_arm'), t('arch_arm_detail'), armUrl, arm && arm.size));
      if (x86Url) downloads.appendChild(archButton(t('arch_intel'), t('arch_intel_detail'), x86Url, x86 && x86.size));
      dlSection.appendChild(downloads);
      dlSection.appendChild(makeFirstOpenHelp());
      card.appendChild(dlSection);

      host.appendChild(card);
    }

    // ============================================================
    // Boot
    // ============================================================
    renderState('loading');
    fetch('../latest.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(data => {
        if (data && data.beta && data.beta.version) {
          renderBeta(data.beta);
        } else {
          renderState('empty', 'empty_cta', '../');
        }
      })
      .catch(() => renderState('error'));
  </script>
</body>
</html>
